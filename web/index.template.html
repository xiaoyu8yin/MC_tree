<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minecraft 26.3 · 合成依赖总图</title>
<style>
:root{color-scheme:dark;--bg:#101714;--panel:#19231e;--line:#34483a;--fg:#e7eee8;--muted:#afc1b3;--green:#b8e881;--accent:#304b31}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}a{color:var(--green)}button,input,select{font:inherit}button,summary{cursor:pointer}button{color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px}button:hover,button:focus-visible{border-color:var(--green);background:var(--accent)}header{padding:32px 4vw 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{letter-spacing:.17em;color:var(--green);font-size:12px}h1{font-size:clamp(25px,3vw,38px);line-height:1.25;margin:9px 0}p{margin:8px 0}.sub,small{color:var(--muted)}.stats{display:flex;gap:24px}.stats strong{font-size:26px;display:block;color:var(--green)}.toolbar{position:sticky;top:0;z-index:10;background:var(--bg);padding:14px 4vw;display:flex;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}input,select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px}input{flex:1;min-width:200px}label{display:flex;align-items:center;gap:8px}.tabs{display:flex;gap:6px}button.active{background:var(--green);color:#152017}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;padding:24px 4vw;max-width:1700px;margin:auto}aside{max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:90px;align-self:start}.result{display:block;width:100%;text-align:left;border:0;border-radius:0;border-bottom:1px solid var(--line);padding:12px}.result b{display:block}.result small{font-size:11px;overflow-wrap:anywhere}.badge{display:inline-block;background:var(--accent);padding:2px 8px;border-radius:5px;color:var(--green);font-size:12px;margin:2px 5px 2px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}h2{margin:0 0 12px;font-size:24px}h3{font-size:17px;margin:10px 0}.id{font:12px/1.5 monospace;color:var(--muted);overflow-wrap:anywhere}.item{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 9px;margin:3px;color:var(--green)}.group{padding:8px;border-left:3px solid var(--green);background:var(--bg);margin:8px 0}.group small{display:block}.recipe{border-top:1px solid var(--line);padding:14px 0}.recipe:first-child{border-top:0}details{border:1px solid var(--line);border-radius:8px;margin:9px 0;padding:9px 12px}details details{margin-left:12px}summary{overflow-wrap:anywhere}summary:hover{color:var(--green)}.tree .branch{border-left:1px solid var(--line);margin:8px 0 8px 6px;padding-left:14px}.level-items{display:flex;flex-wrap:wrap;gap:4px}.levelhead{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,78px);gap:4px;margin:12px 0}.slot{border:1px solid var(--line);min-height:57px;display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;padding:4px}.slot button{font-size:11px;padding:2px;border:0}.slot:empty{opacity:.35}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:360px;overflow:auto}.tools{display:flex;gap:8px;flex-wrap:wrap}.notice{border-left:3px solid var(--green);padding:8px 14px;margin-bottom:18px}.layer{margin:14px 0;background:var(--panel)}footer{padding:25px 4vw;border-top:1px solid var(--line);color:var(--muted)}.empty{padding:35px;color:var(--muted)}#main{min-width:0}.special{max-width:1000px;margin:25px auto}.linkbtn{border:0;text-decoration:underline;color:var(--green);background:none;padding:2px}.count{font-variant-numeric:tabular-nums}.error{color:#ffd59c}@media(max-width:800px){header{display:block}.stats{margin-top:20px;gap:20px}.layout{grid-template-columns:1fr}aside{position:static;max-height:250px}.toolbar{position:static}details details{margin-left:2px}.grid{grid-template-columns:repeat(3,70px)}}
</style></head><body>
<header><div><div class="eyebrow">THE CRAFTING ATLAS / JAVA EDITION</div><h1>Minecraft 合成依赖总图</h1><p class="sub">原始材料 → 多输入配方 → 成品 · 26.3 稳定版</p></div><div class="stats" id="stats"></div></header>
<div class="toolbar"><input id="search" aria-label="搜索物品或配方" placeholder="搜索中文、英文或 ID，例如：活塞 / piston"><label>层级<select id="level" aria-label="筛选层级"><option value="">全部层级</option></select></label><label>工艺<select id="type" aria-label="筛选工艺"><option value="">全部工艺</option></select></label><div class="tabs"><button id="tab-item" class="active">物品依赖</button><button id="tab-layers">分层总览</button><button id="tab-special">特殊配方</button></div></div>
<div class="layout" id="layout"><aside><p id="result-count" aria-live="polite"></p><div id="results"></div></aside><main id="main"></main></div>
<footer><details><summary>范围、分层规则与数据来源</summary><div id="method"></div></details><div class="tools"><a href="recipes-26.3.json" download>全部原始配方 JSON</a><a href="graph-26.3.json" download>依赖图数据 JSON</a><a href="catalog-26.3.csv" download>完整配方表 CSV</a><a href="https://app.notion.com/p/Minecraft-ef913f5e5b8983a685bb0148daaa4261">返回 Notion 原页</a></div></footer>
<script id="data" type="application/json">__DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('data').textContent),N=D.nodes,R=D.recipes,S=D.special,M=D.meta;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const types={crafting_shaped:'工作台 · 有序合成',crafting_shapeless:'工作台 · 无序合成',smelting:'熔炉',blasting:'高炉',smoking:'烟熏炉',campfire_cooking:'营火',stonecutting:'切石机',smithing_transform:'锻造台 · 升级',smithing_trim:'锻造台 · 纹饰',brewing:'酿造台 · 药水转化',crafting_transmute:'工作台 · 转化 / 染色',crafting_decorated_pot:'工作台 · 饰纹陶罐',crafting_imbue:'药箭 / 效果灌注',crafting_dye:'皮革装备染色',crafting_special_bannerduplicate:'旗帜图案复制',crafting_special_bookcloning:'成书复制',crafting_special_firework_rocket:'烟花火箭',crafting_special_firework_star:'烟火之星',crafting_special_firework_star_fade:'烟火之星褪色',crafting_special_mapextending:'地图扩展',crafting_special_repairitem:'物品修复',crafting_special_shielddecoration:'盾牌图案'};
const typeName=t=>types[t]||t.replace('crafting_special_','特殊 · '),byOut={},byIn={};
for(const r of R){(byOut[r.output]??=[]).push(r);for(const i of new Set(r.groups.flatMap(g=>g.options)))(byIn[i]??=[]).push(r)}
const ids=Object.keys(N).sort((a,b)=>(N[a].level??999)-(N[b].level??999)||N[a].name.localeCompare(N[b].name,'zh-CN'));
let tab='item',selected=location.hash.slice(1);if(!N[selected])selected='piston';if(!N[selected])selected=ids[0];
const name=i=>N[i]?.name||i,chip=i=>`<button class="item" data-item="${esc(i)}">${esc(name(i))}</button>`;
const lvl=i=>N[i].level?`第 ${N[i].level} 层`:'未闭合依赖';
$('stats').innerHTML=`<div><strong>${M.recipeFiles.toLocaleString()}</strong><small>原始配方文件</small></div><div><strong>${M.items.toLocaleString()}</strong><small>依赖物品</small></div><div><strong>${Object.keys(M.levels).length}</strong><small>可达层级</small></div>`;
for(const l of Object.keys(M.levels))$('level').add(new Option(`第 ${l} 层 · ${M.levels[l]} 项`,l));if(M.unresolved.length)$('level').add(new Option('未闭合依赖','null'));
for(const t of [...new Set(R.map(r=>r.type))].sort())$('type').add(new Option(typeName(t),t));
$('method').innerHTML=`<p>核对日期：${M.checked}；适用 Minecraft Java Edition 26.3，非基岩版、快照或模组配方。覆盖该版本默认命名空间 recipe 目录全部 ${M.recipeFiles} 个文件：${M.recipes} 条有固定产出的配方可计算依赖，${M.special} 条动态/特殊配方另列。原始文件完整保留。</p><p>第 1 层包含没有纳入配方产出的边界材料，以及用于打破压缩/解压等循环、可直接在世界中取得的原料。第 1 层不是“不能合成”的断言，也不代表开局可得。原木、矿物、骨头、羊毛等可能同时有配方。</p><p>对每条配方：输入组之间全部需要（AND）；每组中的物品可任选其一（OR）；成品层级 = 1 + 所有输入组最早层级的最大值。同一成品有多条配方时取最早可达值。循环保留回链，无法由边界材料到达的 ${M.unresolved.length} 项单列；替代配方可能来自比成品更高的层级。层级不是游戏进度、采集难度或工作站科技等级。</p><p>工作台、熔炉、高炉、营火、切石机和锻造台是工艺条件，不作为消耗材料递归分层。燃料、工具耐久、返还容器、经验和附加组件不作耗材规划；请在原始 JSON 中核对条件和组件。本图不是总材料计算器。不涵盖酿造、交易、掉落、种植、附魔、铁砧、堆肥、洗涤、氧化、刮蜡等没有静态 recipe 文件的机制；特殊配方不能仅凭文件推导所有变体。</p><p>关系实际是含循环的有向超图；展开树只是以当前物品为根的浏览投影。下游“用途”表示参与该配方，还需配齐同卡片列出的其他输入，不表示只用当前物品就能合成。</p><p>主数据：<a href="https://piston-meta.mojang.com/mc/game/version_manifest_v2.json">Mojang 官方版本清单</a>；<a href="https://www.minecraft.net/en-us/article/minecraft-java-edition-26-3">26.3 官方发布说明</a>；客户端内 data/minecraft/recipe、tags/item 和官方语言文件。客户端 SHA-1：<code>${M.sha1}</code>。</p><p>树中数量均为“一次执行该配方”的数量，祖先分支不自动按目标数量换算。标签分组已展开为该版本实际候选物品；不合并不同木材、颜色或不同配方。</p>`;
function groups(r){return r.groups.map((g,k)=>`<div class="group"><small>必需输入 ${k+1} · ${g.count} 个${g.options.length>1?' · 以下任选一种':''}${g.role?' · '+esc(g.role):''}</small>${g.options.map(chip).join('')||'<span class="error">未解析材料，请查原始配方</span>'}</div>`).join('')}
function raw(r){return `<details><summary>原始配方 · ${esc(r.id)}</summary><pre>${esc(JSON.stringify(r.raw,null,2))}</pre></details>`}
function grid(r){if(!r.pattern)return '';const map=Object.fromEntries(r.groups.map(g=>[g.symbol,g]));return `<div class="grid" aria-label="配方摆放网格">${Array.from({length:9},(_,n)=>{let s=r.pattern[Math.floor(n/3)]?.[n%3],g=map[s];return `<div class="slot">${g?`<button data-item="${esc(g.options[0])}">${esc(name(g.options[0]))}${g.options.length>1?'<br>或同组替代品':''}</button>`:''}</div>`}).join('')}</div>`}
function recipe(r){return `<article class="recipe"><h3>${esc(typeName(r.type))} <span class="badge">产出 ${r.count} × ${esc(name(r.output))}</span></h3><div class="id">${esc(r.id)}</div>${r.time?`<small>${r.time} 游戏刻 · ${(r.time/20).toFixed(1)} 秒；熔炼需燃料，营火无需燃料物品。</small>`:''}${grid(r)}${groups(r)}${raw(r)}</article>`}
function sortedRecipes(i){return [...(byOut[i]||[])].sort((a,b)=>score(a)-score(b))}
function score(r){return Math.max(...r.groups.map(g=>Math.min(...g.options.map(i=>N[i].level??999))))}
function treeItem(i,path=[],dir='up'){
 const d=document.createElement('details');const cycle=path.includes(i);d.innerHTML=`<summary>${esc(name(i))} <span class="badge">${lvl(i)}</span>${cycle?' ↩ 循环回链':N[i].root?' · 边界原料':''}</summary>`;
 if(cycle){d.innerHTML+=`<p>已在当前路径出现；停止重复展开。${chip(i)}</p>`;return d}
 d.addEventListener('toggle',()=>{if(!d.open||d.dataset.loaded)return;d.dataset.loaded='1';const b=document.createElement('div');b.className='branch';b.innerHTML=`${chip(i)} <small>${esc(i)}</small>`;
 const rs=dir==='up'?sortedRecipes(i):(byIn[i]||[]);
 if(N[i].root&&dir==='up')b.insertAdjacentHTML('beforeend','<p class="sub">可作为外部取得的边界原料；以下仍保留其可用配方。</p>');
 if(!rs.length)b.insertAdjacentHTML('beforeend',`<p class="sub">${dir==='up'?'无固定配方，需从世界或其他机制取得。':'没有作为输入的固定配方。'}</p>`);
 for(const r of rs){const rd=document.createElement('details');rd.innerHTML=`<summary>${esc(typeName(r.type))} · ${dir==='up'?'可选配方':esc(name(r.output))+' × '+r.count} <small>${esc(r.id)}</small></summary>`;rd.addEventListener('toggle',()=>{if(!rd.open||rd.dataset.loaded)return;rd.dataset.loaded='1';const bb=document.createElement('div');bb.className='branch';bb.innerHTML=`<p>以下输入组全部需要 → ${chip(r.output)} × ${r.count}</p>`;for(const [k,g] of r.groups.entries()){const gd=document.createElement('details');gd.innerHTML=`<summary>输入 ${k+1}：${g.count} 个 · ${g.options.length>1?g.options.length+' 种材料任选其一':esc(name(g.options[0]))}</summary>`;gd.addEventListener('toggle',()=>{if(!gd.open||gd.dataset.loaded)return;gd.dataset.loaded='1';for(const x of g.options)gd.append(treeItem(x,[...path,i],'up'))});bb.append(gd)}if(dir==='down'){bb.insertAdjacentHTML('beforeend','<p>继续查看该产物的用途 ↓</p>');bb.append(treeItem(r.output,[...path,i],'down'))}bb.insertAdjacentHTML('beforeend',raw(r));rd.append(bb)});b.append(rd)}d.append(b)});return d
}
function detail(){const n=N[selected],rs=sortedRecipes(selected);$('main').innerHTML=`<div class="card"><span class="eyebrow">SELECTED ITEM</span><h2>${esc(n.name)} <span class="badge">${lvl(selected)}</span></h2><div class="id">minecraft:${esc(selected)} · ${esc(n.en)}</div><p>${n.root?'边界原料 · 可从世界取得或在静态配方范围外取得。':'通过输入配方得到的物品。'} ${rs.length} 条固定产出配方；参与 ${(byIn[selected]||[]).length} 条配方。</p><div class="tools"><button id="up">展开前置依赖</button><button id="down">展开后续用途</button><button id="copy">复制物品链接</button></div></div><div class="notice">多输入必须齐备；同组候选任选一种。层级按最早可达配方计算，完整替代配方仍保留。</div><section class="card tree"><h3>可展开依赖树</h3><div id="tree"></div></section><section class="card"><h3>全部固定产出配方</h3>${rs.length?rs.map(recipe).join(''):'<p>没有固定产出配方。请从采集、掉落、交易等游戏机制取得；特殊配方另见对应列表。</p>'}</section>`;
 const root=treeItem(selected,[],'up');$('tree').append(root);root.open=true;$('up').onclick=()=>{const t=treeItem(selected,[],'up');$('tree').replaceChildren(t);t.open=true};$('down').onclick=()=>{const t=treeItem(selected,[],'down');$('tree').replaceChildren(t);t.open=true};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('copy').textContent='已复制'}catch{$('copy').textContent='请复制浏览器地址栏'}};
}
function filtered(){const q=$('search').value.trim().toLowerCase(),l=$('level').value,t=$('type').value;return ids.filter(i=>{const n=N[i];return(!q||`${i} ${n.name} ${n.en} ${(byOut[i]||[]).map(r=>r.id).join(' ')}`.toLowerCase().includes(q))&&(!l||String(n.level)===l)&&(!t||(byOut[i]||[]).some(r=>r.type===t))})}
function results(){const list=filtered();$('result-count').textContent=`${list.length} / ${ids.length} 项物品`;$('results').innerHTML=list.map(i=>`<button class="result ${i===selected?'active':''}" data-item="${esc(i)}"><b>${esc(name(i))}</b><small>${lvl(i)} · ${esc(i)}</small></button>`).join('');return list}
function layers(){const list=results(),ls=[...Object.keys(M.levels),'null'];$('main').innerHTML=`<h2>分层总览</h2><p class="sub">第 1 层为边界原料；第 n 层的最早配方所需全部输入可在更早层取得。点击任意物品查看完整依赖。</p>${ls.map(l=>{const a=list.filter(i=>String(N[i].level)===l);return a.length?`<details class="layer" ${l==='1'?'open':''}><summary>第 ${l==='null'?'未闭合':l} 层 · ${a.length} 项</summary><div class="level-items">${a.map(chip).join('')}</div></details>`:''}).join('')||'<div class="empty">没有匹配项</div>'}`}
function specials(){results();const q=$('search').value.toLowerCase(),a=S.filter(r=>(r.id+' '+r.type).toLowerCase().includes(q));$('main').innerHTML=`<h2>动态与特殊配方 · ${S.length} 项</h2><p>这些文件由游戏代码决定输出或组件，不能冒充固定材料配方。这里保留全部原始定义。包含纹饰、烟花、染色、地图、修理等，具体以条目为准。</p>${a.map(r=>`<div class="card"><h3>${esc(typeName(r.type))}</h3>${raw(r)}</div>`).join('')||'<p>没有匹配项。此列表按英文配方 ID 搜索。</p>'}`}
function render(){for(const k of ['item','layers','special'])$('tab-'+k).classList.toggle('active',tab===k);if(tab==='item'){results();detail()}else if(tab==='layers')layers();else specials()}
function select(i){if(!N[i])return;selected=i;tab='item';history.replaceState(null,'','#'+i);render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-item]');if(b)select(b.dataset.item)});
for(const k of ['item','layers','special'])$('tab-'+k).onclick=()=>{tab=k;render()};
for(const k of ['search','level','type'])$(k).addEventListener(k==='search'?'input':'change',()=>{if(tab==='item')results();else render()});
window.addEventListener('hashchange',()=>{if(N[location.hash.slice(1)])select(location.hash.slice(1))});render();
</script></body></html>
