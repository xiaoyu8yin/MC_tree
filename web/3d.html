</style><div id="mc-background" aria-hidden="true"></div><div id="mc-shade" aria-hidden="true"></div><canvas id="scene" aria-label="七层三维合成依赖图，使用搜索或选择物品显示路径" tabindex="0"></canvas><header><div class="tag">MINECRAFT / JAVA 26.3</div><h1>物品合成树</h1></header><aside><div id="background-controls"><label for="background-mode">背景试验</label><select id="background-mode"><option value="mc">MC 风格 · 方块夜景</option><option value="plain">原版 · 纯色背景</option></select><label for="background-strength">背景强度 <span id="background-value">32%</span></label><input id="background-strength" type="range" min="10" max="65" value="32"><small>中心区域压暗，让节点与连线更清晰。</small><br><a href="3d-plain.html">打开修改前版本 ↗</a></div><label for="q">搜索并选择物品</label><input id="q" placeholder="中文、英文或 ID" autocomplete="off"><div class="results" id="results"></div><section id="info"><h2>选择一个物品</h2><p>默认隐藏所有关系线。点击空间中的节点，或搜索物品，查看其前置合成路径。</p></section><p id="status" aria-live="polite"></p><a href="index.html">查看原始总图与完整配方 ↗</a></aside><footer><label><input id="tree-decor" type="checkbox" checked style="width:auto"> 树形装饰</label><button id="clear">取消选择 / 隐藏连线</button><button id="reset">重置视角</button><button id="motion">暂停流动</button><label><input id="only" type="checkbox" style="width:auto"> 仅显示当前路径</label></footer><script src="graph3d-data.js"></script><script src="graph3d.js?v=tree2"></script><script src="background.js"></script></html>
